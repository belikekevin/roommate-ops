app = "roommate-ops" # change to your Fly app name
primary_region = "iad" # pick the region closest to your database (iad is next to Neon us-east-2)

[http_service]
  internal_port = 3000
  force_https = true
  # The scheduler lives in-process, so the Machine must never sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
